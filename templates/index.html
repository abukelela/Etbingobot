<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beteseb Bingo</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <div class="header-left">
      <div class="player-info" id="playerInfo">👤 ተጫዋች</div>
      <div class="player-count" id="playerCount">👥 0</div>
    </div>
    <div class="called-badge" id="calledBadge">📢 0/75</div>
  </div>

  <div class="caller">
    <div class="last-called-label">🎯 የተጠራው ቁጥር</div>
    <div class="last-called" id="lastCalled">—</div>
    <div class="auto-status" id="autoStatus"></div>
  </div>

  <div id="status"></div>

  <div id="board"></div>

  <div class="history-title">📜 ታሪክ</div>
  <div class="history" id="history"></div>
</div>

<div id="confetti"></div>

<script src="/static/script.js"></script>
</body>
</html>
