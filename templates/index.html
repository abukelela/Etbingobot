<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beteseb Bingo</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">
  <div class="title-bar">
    <span class="bingo-ball">🎱</span>
    <h1>Beteseb Bingo</h1>
  </div>

  <div class="top-controls">
    <div class="players-control">
      <span class="ps-label">👥 ተጫዋቾች</span>
      <div class="players-buttons" id="playersButtons"></div>
    </div>
  </div>

  <div class="caller">
    <div class="called-label">📢 የተጠሩ: <span id="calledCount">0/75</span></div>
    <div class="last-called" id="lastCalled"></div>
    <div class="timer" id="timer"></div>

    <div class="caller-buttons">
      <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">
        <span id="autoIcon">▶️</span> <span id="autoText">ራስ-ሰር</span>
      </button>
      <button class="btn-call" id="callBtn" onclick="callNumber()">
        <span>🔢</span> ጥራ
      </button>
    </div>
  </div>

  <div id="status"></div>

  <div id="boards" class="boards"></div>

  <div class="actions">
    <button onclick="openBoard()">
      <span>📊</span> የተጠሩ ቁጥሮች
    </button>
    <button onclick="newGame()">
      <span>🔄</span> አዲስ ጨዋታ
    </button>
  </div>

  <div class="history-title">📜 የተጠሩ ቁጥሮች</div>
  <div class="history" id="history"></div>
</div>

<!-- የተጠሩ ቁጥሮች Modal -->
<div id="boardModal" class="modal" onclick="closeBoard(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>📊 የተጠሩ ቁጥሮች (1-75)</h2>
      <button class="modal-close" onclick="closeBoard()">✕</button>
    </div>
    <div class="modal-stats" id="modalStats"></div>
    <div class="number-grid" id="boardGrid"></div>
  </div>
</div>

<div id="confetti"></div>

<script src="/static/script.js"></script>
</body>
      </html>
