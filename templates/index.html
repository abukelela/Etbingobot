<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etbingo</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="container">
  <div class="header-bar">
    <div class="header-left">
      <div class="player-info" id="playerInfo">👤 ተጫዋች</div>
      <div class="player-count" id="playerCount">👥 0</div>
    </div>
    <div class="called-badge" id="calledBadge">📢 0/75</div>
  </div>

  <div class="invite-bar">
    <button class="btn-invite" onclick="inviteFriends()">
      <span>📤</span> ጓደኞችን ጋብዝ
    </button>
  </div>

  <div id="noGameScreen" class="screen">
    <div class="empty-icon">🎱</div>
    <h2>Etbingo</h2>
    <p class="empty-text">አዲስ ጨዋታ ለመጀመር ከታች ይጫኑ</p>
    <button class="btn-primary" onclick="createGame()">
      <span>🎮</span> አዲስ ጨዋታ ጀምር
    </button>
  </div>

  <div id="pickScreen" class="screen" style="display:none">
    <div class="empty-icon">🎫</div>
    <h2>ካርድዎን ይምረጡ</h2>
    <p class="empty-text">ከ 1 እስከ 144 ቁጥር ይምረጡ</p>
    <button class="btn-primary" onclick="openPicker()">
      <span>🎫</span> ካርድ ምረጥ
    </button>
    <button class="btn-secondary" onclick="joinWithRandom()">
      <span>🎲</span> በዘፈቀደ
    </button>
  </div>

  <div id="gameScreen" class="screen" style="display:none">
    <div class="caller">
      <div class="last-called-label">🎯 የተጠራው ቁጥር</div>
      <div class="last-called" id="lastCalled">—</div>
      <div class="auto-status" id="autoStatus"></div>
    </div>
    <div class="game-controls">
      <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">
        <span id="autoIcon">▶️</span> <span id="autoText">ራስ-ሰር</span>
      </button>
      <button class="btn-call" id="callBtn" onclick="drawNumber()">
        <span>🔢</span> ጥራ
      </button>
      <button class="btn-new" onclick="confirmNewGame()">
        <span>🔄</span>
      </button>
    </div>
    <div id="status"></div>
    <div id="board"></div>
    <div class="history-title">📜 ታሪክ</div>
    <div class="history" id="history"></div>
  </div>
</div>

<div id="pickerModal" class="modal" onclick="closePicker(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>🎫 የካርድ ቁጥር ይምረጡ (1-144)</h2>
      <button class="modal-close" onclick="closePicker()">✕</button>
    </div>
    <div class="picker-info">
      <div class="picker-hint">ቁጥር ይምረጡ — ራሱ ካርድዎን ይሰጣል</div>
    </div>
    <div class="number-grid-picker" id="pickerGrid"></div>
  </div>
</div>

<div id="confetti"></div>
<script src="/static/script.js"></script>
</body>
</html>
