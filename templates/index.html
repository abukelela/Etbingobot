<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beteseb Bingo</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="container">
  <h1>🎱 Beteseb Bingo</h1>
  <p class="subtitle">የቤተሰብ ቢንጎ ጨዋታ</p>

  <div class="caller">
    <div class="last-called" id="lastCalled">—</div>
    <button class="btn-call" id="callBtn" onclick="callNumber()">🔢 ቁጥር ጥራ</button>
  </div>

  <div id="status"></div>
  <div id="board"></div>

  <div class="actions">
    <button onclick="newGame()">🔄 አዲስ ጨዋታ</button>
  </div>

  <div class="history" id="history"></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
